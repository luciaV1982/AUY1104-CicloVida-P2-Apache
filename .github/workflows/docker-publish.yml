name: Apache Docker Build and Push

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build imagen Apache
        run: |
          docker build -t luciav1982/apache-demo:v1 .
          docker tag luciav1982/apache-demo:v1 luciav1982/apache-demo:latest

      - name: Push imagen Docker Hub
        run: |
          docker push luciav1982/apache-demo:v1
          docker push luciav1982/apache-demo:latest
